<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark light" />
    <title>ADGS · 智能体达尔文进化观测台</title>
    <script>
      // 首屏防闪：CSS 加载前先应用主题（白天/黑夜）
      (function () {
        try {
          if (localStorage.getItem("adgs_theme") === "light") {
            document.documentElement.dataset.theme = "light";
          }
        } catch (e) {}
      })();
    </script>
    <style>
      /* 首屏防闪：在 CSS 加载前先铺底色 */
      html { background: #060a13; }
      html[data-theme="light"] { background: #eef1f6; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
